server:
  port: 8080

spring:
  application:
    name: doudizhu-backend

  # Database configuration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/doudizhu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  # MyBatis Plus configuration
  mybatis-plus:
    mapper-locations: classpath*:/mapper/**/*.xml
    type-aliases-package: com.game.doudizhu.entity
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  websocket:
    path: /ws

  # Security configuration
  security:
    enabled: false

  # CORS configuration
  web:
    cors:
      allowed-origins:
        - "http://localhost:3000"
        - "http://localhost:3001"
        - "http://127.0.0.1:3000"
        - "http://127.0.0.1:3001"
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"

logging:
  level:
    com.game.doudizhu: DEBUG
    org.springframework.web.socket: DEBUG

# Custom game configurations
game:
  max-players-per-room: 3
  max-reconnection-timeout: 30000
  card-deck-type: standard
